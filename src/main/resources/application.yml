server:
  port: ${PORT:8080}

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-replace-before-deployment-1234567890}

spring:
  application:
    name: student
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/students_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 10000
